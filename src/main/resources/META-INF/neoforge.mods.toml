license = "MIT"

[[mods]]
modId = "robloxphysics"
version = "2.0.0"
displayName = "Roblox Physics"
description = '''
Makes Minecraft feel like Roblox: Roblox character physics (gravity, WalkSpeed, JumpHeight, instant air
control, no sprint, no jump cooldown, no fall damage), the Roblox third-person camera on F5, live Lua/Luau
scripting with a Roblox-style API, and the F9 Developer Console. Install on client AND server.
'''

[[mixins]]
config = "robloxphysics.mixins.json"

[[dependencies.robloxphysics]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.robloxphysics]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"
