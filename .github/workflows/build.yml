name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: skybeat
          path: build/libs/*.jar

  client_test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew runProductionClientGametest --stacktrace
      - name: Screenshots
        if: always()
        run: |
          for f in $(find . -name 'skybeat_*.png' | sort); do
            convert "$f" -resize 960x -quality 72 /tmp/shot.jpg
            echo "SHOT_BEGIN $(basename $f)"; base64 -w0 /tmp/shot.jpg; echo; echo "SHOT_END"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: '**/screenshots/*.png'
