name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: skybeat
          path: build/libs/*.jar

  client_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run client game test
        run: |
          ./gradlew runProductionClientGametest --stacktrace &
          GP=$!
          for i in $(seq 1 120); do
            sleep 5
            kill -0 $GP 2>/dev/null || break
          done
          if kill -0 $GP 2>/dev/null; then
            echo "Game test timed out; thread dumps:"
            for p in $(jps -l | grep -v -i -E 'gradle|jps' | awk '{print $1}'); do echo "=== $p"; jps -l | grep "^$p"; jstack $p | head -400; done
            kill $GP; exit 1
          fi
          wait $GP
      - name: Screenshots
        if: always()
        run: |
          pip install -q pillow
          for f in $(find / -name '*skybeat_*.png' -not -path '/proc/*' 2>/dev/null | sort); do
            python3 -c "import sys; from PIL import Image; im=Image.open(sys.argv[1]).convert('RGB'); im.thumbnail((960,960)); im.save('/tmp/shot.jpg', quality=72)" "$f"
            echo "SHOT_BEGIN $(basename $f)"; base64 -w0 /tmp/shot.jpg; echo; echo "SHOT_END"
          done
      - name: Dump main pass
        if: always()
        run: |
          ./gradlew genSources -q
          JAR=$(find $PWD/.gradle -name 'minecraft-*sources.jar' | head -1)
          mkdir -p /tmp/src && cd /tmp/src && unzip -q -o "$JAR"
          F=$(find . -name LevelRenderer.java)
          grep -n "prepareChunkRenders\|renderGroup\|addMainPass\|private void addMainPass\|framePass.executes\|profilerFiller.push\|popPush" "$F" | head -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: '**/*skybeat_*.png'
