plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    mavenCentral()
}

configurations {
    // Libraries whose classes are copied into our jar (LuaJ is a plain, non-modular jar)
    shade
    implementation.extendsFrom shade
}

dependencies {
    shade 'org.luaj:luaj-jse:3.0.1'
}

jar {
    from({ configurations.shade.collect { zipTree(it) } }) {
        // default-package CLI classes are illegal inside a module; javax.script/luajc/bcel bits are unused
        exclude '*.class', 'META-INF/**', 'org/luaj/vm2/script/**', 'org/luaj/vm2/luajc/**',
                'org/luaj/vm2/server/**', 'org/luaj/vm2/ast/**', 'org/luaj/vm2/parser/**'
    }
}

neoForge {
    version = project.neo_version

    // src/main/resources/META-INF/accesstransformer.cfg is picked up automatically.

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
