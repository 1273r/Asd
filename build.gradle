plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property 'archivesName', project.base.archivesName
	from('LICENSE') {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// In-game smoke test: boots a real client, plays a synthetic track through the visualizer
// and takes screenshots. Run with ./gradlew runProductionClientGametest
sourceSets {
	gametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

tasks.register('gametestJar', Jar) {
	from sourceSets.gametest.output
	destinationDirectory = layout.buildDirectory.dir('devlibs')
	archiveClassifier = 'gametest'
}

tasks.register('remapGametestJar', net.fabricmc.loom.task.RemapJarTask) {
	dependsOn gametestJar
	input = tasks.named("gametestJar").flatMap { it.archiveFile }
	destinationDirectory = layout.buildDirectory.dir('gametest-libs')
	archiveClassifier = 'gametest'
	addNestedDependencies = false
	classpath.from(sourceSets.gametest.compileClasspath)
}

configurations {
	productionMods {
		transitive = false
	}
}

dependencies {
	productionMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	productionMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_version)
}

tasks.register('runProductionClientGametest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	dependsOn remapJar, remapGametestJar
	mods.from(configurations.productionMods)
	mods.from(remapJar.archiveFile)
	mods.from(tasks.named("remapGametestJar").flatMap { it.archiveFile })
	jvmArgs.add('-Dfabric.client.gametest')
	jvmArgs.add('-Dfabric.client.gametest.disableNetworkSynchronizer=true')
}
